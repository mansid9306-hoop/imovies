<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMovies - Movie Ticket Booking Made Simple</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #e50914;
      --primary-hover: #b80710;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --border: rgba(255, 255, 255, 0.08);
      --seat-avail: #334155;
      --seat-selected: #f59e0b;
      --seat-booked: #1e293b;
      --seat-locked: #ef4444;
    }
    body {
      margin: 0;
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .cinema-navbar {
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1030;
    }
    .cinema-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }
    .cinema-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
      border-color: rgba(229, 9, 20, 0.3);
    }
    .glow-btn {
      background: linear-gradient(135deg, #e50914 0%, #b80710 100%);
      color: #ffffff !important;
      border: none;
      font-weight: 600;
      border-radius: 8px;
      padding: 9px 18px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.35);
    }
    .glow-btn:hover {
      background: linear-gradient(135deg, #f01420 0%, #cb0912 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5);
    }
    .glow-btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a !important;
      border: none;
      font-weight: 700;
      border-radius: 8px;
      padding: 9px 18px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    }
    .hero-banner {
      position: relative;
      min-height: 480px;
      background-size: cover;
      background-position: center 25%;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      margin-bottom: 2rem;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.8) 50%, rgba(15,23,42,0.4) 100%);
    }
    .screen-curve {
      height: 24px;
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.6) 0%, rgba(59, 130, 246, 0.05) 100%);
      border-top: 4px solid #60a5fa;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      box-shadow: 0 -10px 30px rgba(96, 165, 250, 0.4);
    }
    .seat-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .seat-btn.available { background-color: var(--seat-avail); color: #cbd5e1; }
    .seat-btn.available:hover { background-color: #475569; color: #fff; transform: scale(1.18); }
    .seat-btn.selected { background-color: var(--seat-selected); color: #0f172a; border-color: #fef08a; transform: scale(1.15); box-shadow: 0 0 10px rgba(245,158,11,0.6); }
    .seat-btn.booked { background-color: var(--seat-booked); color: #475569; border-color: #334155; cursor: not-allowed; opacity: 0.5; }
    .ticket-wrapper {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 24px;
      position: relative;
    }
    .ticket-notch-left, .ticket-notch-right {
      position: absolute;
      top: 50%;
      width: 24px;
      height: 24px;
      background-color: var(--bg-dark);
      border-radius: 50%;
      transform: translateY(-50%);
    }
    .ticket-notch-left { left: -12px; }
    .ticket-notch-right { right: -12px; }
    .badge-gold { background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .badge-red { background-color: rgba(229, 9, 20, 0.15); color: #f87171; border: 1px solid rgba(229, 9, 20, 0.3); padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .badge-blue { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .cinema-input {
      background-color: #0f172a !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #f8fafc !important;
      border-radius: 8px;
    }
    .cinema-input:focus { border-color: #e50914 !important; box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.25) !important; }
    .cinema-modal { background-color: #1e293b; color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
  </style>

  <!-- React 18 & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>
</head>

      }

    const THEATRES = [
      {
        _id: 't1',
        name: 'PVR INOX Superplex Luxe',
        city: 'Mumbai',
        location: 'Phoenix Palladium, Lower Parel',
        facilities: ['IMAX Laser 3D', 'Dolby Atmos', 'Recliner Seating', 'Valet Parking'],
      },
      {
        _id: 't2',
        name: 'Cinepolis VIP MegaMall',
        city: 'Bengaluru',
        location: 'Forum Mall, Koramangala',
        facilities: ['4DX Dynamic Seats', 'Dolby Atmos 7.1', 'Gourmet Lounge'],
      },
      {
        _id: 't3',
        name: 'Grand CineStar Horizon',
        city: 'Delhi NCR',
        location: 'Cyber Hub, Gurugram',
        facilities: ['4K Laser Projection', 'Dolby Atmos', 'Food Court'],
      },
      {
        _id: 't4',
        name: 'Prasad Multiplex IMAX',
        city: 'Hyderabad',
        location: 'NTR Gardens, Khairatabad',
        facilities: ['Giant IMAX Screen', 'Dolby 7.1', 'Gaming Arena'],
      }
    ];

    const generateSeats = () => {
      const seats = [];
      const rows = [
        { name: 'A', tier: 'vip', price: 450 },
        { name: 'B', tier: 'vip', price: 450 },
        { name: 'C', tier: 'premium', price: 300 },
        { name: 'D', tier: 'premium', price: 300 },
        { name: 'E', tier: 'standard', price: 200 },
        { name: 'F', tier: 'standard', price: 200 },
      ];
      for (const r of rows) {
        for (let col = 1; col <= 10; col++) {
          const isBooked = (r.name === 'B' && (col === 4 || col === 5)) || (r.name === 'C' && col === 8);
          seats.push({
            seatId: `${r.name}${col}`,
            row: r.name,
            col,
            tier: r.tier,
            price: r.price,
            status: isBooked ? 'booked' : 'available',
          });
        }
      }
      return seats;
    };

    // --- MAIN REACT APPLICATION ---
    function App() {
      // Navigation / Routing state
      const [currentView, setCurrentView] = useState('home'); // 'home', 'movies', 'details', 'booking', 'checkout', 'success', 'my-bookings', 'admin', 'login'
      const [selectedCity, setSelectedCity] = useState('All Cities');
      const [selectedMovie, setSelectedMovie] = useState(INITIAL_MOVIES[0]);
      const [selectedShow, setSelectedShow] = useState(null);

      // Auth state
      const [user, setUser] = useState({
        _id: 'u1',
        name: 'Alex Johnson',
        email: 'alex@example.com',
        role: 'user',
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
      });

      // Data state
      const [movies, setMovies] = useState(INITIAL_MOVIES);
      const [selectedSeats, setSelectedSeats] = useState([]);
      const [seatMatrix, setSeatMatrix] = useState(generateSeats());
      const [bookings, setBookings] = useState([
        {
          _id: 'b1',
          bookingNumber: 'IM-2026-492817',
          movieTitle: 'Dune: Part Two',
          moviePoster: INITIAL_MOVIES[0].poster,
          theatreName: 'PVR INOX Superplex Luxe',
          screenName: 'Audi 1 - IMAX Laser',
          showDate: new Date().toISOString().split('T')[0],
          showTime: '06:15 PM',
          seats: ['C5', 'C6'],
          totalAmount: 738,
          bookingStatus: 'confirmed',
          createdAt: new Date().toISOString(),
        }
      ]);
      const [latestBooking, setLatestBooking] = useState(null);
      const [ticketModalBooking, setTicketModalBooking] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [genreFilter, setGenreFilter] = useState('all');

      // Countdown Timer for seat lock (8 mins)
      const [lockTimer, setLockTimer] = useState(480);

      useEffect(() => {
        if (currentView === 'checkout') {
          const timer = setInterval(() => {
            setLockTimer(prev => prev > 1 ? prev - 1 : 480);
          }, 1000);
          return () => clearInterval(timer);
        }
      }, [currentView]);

      // Seat selection toggle
      const handleSeatClick = (seat) => {
        if (seat.status === 'booked') return;
        if (selectedSeats.includes(seat.seatId)) {
          setSelectedSeats(prev => prev.filter(s => s !== seat.seatId));
        } else {
          if (selectedSeats.length >= 8) {
            alert('Maximum 8 seats allowed per booking');
            return;
          }
          setSelectedSeats(prev => [...prev, seat.seatId]);
        }
      };

      // Pricing Calculations
      const seatDetails = selectedSeats.map(id => seatMatrix.find(s => s.seatId === id));
      const ticketTotal = seatDetails.reduce((sum, s) => sum + (s?.price || 0), 0);
      const convFee = selectedSeats.length * 15;
      const gst = Math.round((ticketTotal + convFee) * 0.18);
      const grandTotal = ticketTotal + convFee + gst;

      // Finalize Booking
      const handleConfirmPayment = () => {
        const newBookingNum = `IM-${new Date().getFullYear()}-${Math.floor(100000 + Math.random() * 900000)}`;
        const newBooking = {
          _id: `b_${Date.now()}`,
          bookingNumber: newBookingNum,
          movieTitle: selectedMovie.title,
          moviePoster: selectedMovie.poster,
          theatreName: selectedShow?.theatreName || 'PVR INOX Superplex Luxe',
          screenName: selectedShow?.screenName || 'Audi 1 - IMAX 3D Laser',
          showDate: selectedShow?.date || new Date().toISOString().split('T')[0],
          showTime: selectedShow?.time || '06:15 PM',
          seats: selectedSeats,
          totalAmount: grandTotal,
          bookingStatus: 'confirmed',
          createdAt: new Date().toISOString(),
        };

        // Mark seats as booked
        setSeatMatrix(prev => prev.map(s => selectedSeats.includes(s.seatId) ? { ...s, status: 'booked' } : s));
        setBookings([newBooking, ...bookings]);
        setLatestBooking(newBooking);
        setSelectedSeats([]);
        setCurrentView('success');
      };

      // Cancel Booking
      const handleCancelBooking = (bookingId) => {
        if (!confirm('Are you sure you want to cancel this booking? You will receive an 85% refund.')) return;
        setBookings(prev => prev.map(b => b._id === bookingId ? { ...b, bookingStatus: 'cancelled' } : b));
        alert('Booking cancelled successfully. Refund initiated.');
      };

      // Add Movie (Admin)
      const handleAddMovie = (e) => {
        e.preventDefault();
        const form = e.target;
        const movieObj = {
          _id: `m_${Date.now()}`,
          title: form.title.value,
          description: form.description.value,
          genre: form.genre.value.split(',').map(g => g.trim()),
          language: ['English', 'Hindi'],
          duration: Number(form.duration.value) || 150,
          releaseDate: new Date().toISOString().split('T')[0],
          poster: form.poster.value || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80',
          banner: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1400&q=80',
          trailerUrl: form.trailerUrl.value || 'https://www.youtube.com/embed/Way9Dexny3w',
          rating: Number(form.rating.value) || 8.5,
          certificate: form.certificate.value || 'UA',
          status: 'now_showing',
          director: form.director.value || 'Director',
          cast: ['Lead Actor', 'Co-Star'],
        };
        setMovies([movieObj, ...movies]);
        alert(`Movie "${movieObj.title}" added to catalog!`);
        form.reset();
      };

      // Switch role quick helper
      const switchRole = (newRole) => {
        if (newRole === 'admin') {
          setUser({ _id: 'admin1', name: 'Cinema Admin', email: 'admin@imovies.com', role: 'admin', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80' });
        } else {
          setUser({ _id: 'u1', name: 'Alex Johnson', email: 'alex@example.com', role: 'user', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80' });
        }
      };

      // Filtered movies
      const filteredMovies = movies.filter(m => {
        const matchesSearch = m.title.toLowerCase().includes(searchQuery.toLowerCase()) || m.director?.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesGenre = genreFilter === 'all' || m.genre.some(g => g.toLowerCase() === genreFilter.toLowerCase());
        return matchesSearch && matchesGenre;
      });

      return (
        <div>
          {/* Top Navbar */}
          <nav className="cinema-navbar py-2 px-3 px-md-4">
            <div className="container-fluid d-flex align-items-center justify-content-between">
              <div className="d-flex align-items-center" style={{ cursor: 'pointer' }} onClick={() => setCurrentView('home')}>
                <div className="d-flex align-items-center justify-content-center me-2" style={{ width: 38, height: 38, borderRadius: 10, background: 'linear-gradient(135deg, #e50914, #b80710)' }}>
                  <i className="bi bi-film text-white fs-5"></i>
                </div>
                <div>
                  <span className="fs-4 fw-black text-white">I<span style={{ color: '#e50914' }}>MOVIES</span></span>
                  <span className="d-none d-sm-block text-secondary" style={{ fontSize: '10px', marginTop: '-4px', letterSpacing: '1px' }}>CINEMA TICKETING</span>
                </div>
              </div>

              {/* City selector */}
              <div className="d-none d-md-flex align-items-center ms-3 me-auto">
                <i className="bi bi-geo-alt-fill text-danger me-1"></i>
                <select className="form-select form-select-sm cinema-input text-white border-0 py-1" style={{ width: '130px' }} value={selectedCity} onChange={(e) => setSelectedCity(e.target.value)}>
                  {['All Cities', 'Mumbai', 'Bengaluru', 'Delhi NCR', 'Hyderabad'].map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              {/* Nav links */}
              <div className="d-none d-lg-flex align-items-center gap-2 me-3">
                <button className={`btn btn-sm ${currentView === 'home' ? 'text-white fw-bold bg-danger bg-opacity-25' : 'text-secondary'} rounded-pill px-3`} onClick={() => setCurrentView('home')}>
                  <i className="bi bi-house me-1"></i> Home
                </button>
                <button className={`btn btn-sm ${currentView === 'movies' ? 'text-white fw-bold bg-danger bg-opacity-25' : 'text-secondary'} rounded-pill px-3`} onClick={() => setCurrentView('movies')}>
                  <i className="bi bi-camera-reels me-1"></i> Movies
                </button>
                <button className={`btn btn-sm ${currentView === 'my-bookings' ? 'text-white fw-bold bg-danger bg-opacity-25' : 'text-secondary'} rounded-pill px-3`} onClick={() => setCurrentView('my-bookings')}>

                </div>

                {/* KPI Metrics */}
                <div className="row row-cols-2 row-cols-lg-4 g-3 mb-4">
                  <div className="col">
                    <div className="cinema-card p-3">
                      <span className="text-secondary small text-uppercase fw-bold">Gross Revenue</span>
                      <h3 className="fw-black text-success mt-1">₹{bookings.filter(b => b.bookingStatus === 'confirmed').reduce((acc, c) => acc + c.totalAmount, 0).toLocaleString()}</h3>
                      <span className="text-secondary" style={{ fontSize: '11px' }}>{bookings.filter(b => b.bookingStatus === 'confirmed').length} Confirmed Sales</span>
                    </div>
                  </div>
                  <div className="col">
                    <div className="cinema-card p-3">
                      <span className="text-secondary small text-uppercase fw-bold">Active Movies</span>
                      <h3 className="fw-black text-white mt-1">{movies.length}</h3>
                      <span className="text-secondary" style={{ fontSize: '11px' }}>In Cinema Theatres</span>
                    </div>
                  </div>
                  <div className="col">
                    <div className="cinema-card p-3">
                      <span className="text-secondary small text-uppercase fw-bold">Partner Theatres</span>
                      <h3 className="fw-black text-white mt-1">{THEATRES.length}</h3>
                      <span className="text-secondary" style={{ fontSize: '11px' }}>Mumbai, BLR, Delhi, HYD</span>
                    </div>
                  </div>
                  <div className="col">
                    <div className="cinema-card p-3">
                      <span className="text-secondary small text-uppercase fw-bold">Total Bookings</span>
                      <h3 className="fw-black text-warning mt-1">{bookings.length}</h3>
                      <span className="text-secondary" style={{ fontSize: '11px' }}>Audit log records</span>
                    </div>
                  </div>
                </div>

                {/* Add Movie Form */}
                <div className="cinema-card p-4 mb-4">
                  <h5 className="fw-bold text-white mb-3"><i className="bi bi-plus-circle text-danger me-2"></i>Add Movie to Catalog</h5>
                  <form onSubmit={handleAddMovie}>
                    <div className="row g-3">
                      <div className="col-sm-6"><input type="text" name="title" className="form-control cinema-input" placeholder="Movie Title (e.g. Inception)" required /></div>
                      <div className="col-sm-3"><input type="text" name="director" className="form-control cinema-input" placeholder="Director" required /></div>
                      <div className="col-sm-3"><input type="number" step="0.1" name="rating" className="form-control cinema-input" placeholder="Rating (e.g. 8.8)" required /></div>
                      <div className="col-sm-4"><input type="text" name="genre" className="form-control cinema-input" placeholder="Genres (e.g. Action, Sci-Fi)" required /></div>
                      <div className="col-sm-4"><input type="number" name="duration" className="form-control cinema-input" placeholder="Duration (mins)" required /></div>
                      <div className="col-sm-4">
                        <select name="certificate" className="form-select cinema-input text-white">
                          <option value="UA">UA (Parental Guidance)</option>
                          <option value="U">U (Universal)</option>
                          <option value="A">A (Adults)</option>
                        </select>
                      </div>
                      <div className="col-12"><input type="url" name="poster" className="form-control cinema-input" placeholder="Poster Image URL (optional)" /></div>
                      <div className="col-12"><textarea name="description" rows="2" className="form-control cinema-input" placeholder="Movie synopsis..." required></textarea></div>
                    </div>
                    <button type="submit" className="btn glow-btn btn-sm mt-3 px-4">Save & Publish Movie</button>
                  </form>
                </div>
              </div>
            )}
          </main>

          {/* Ticket Popup Modal */}
          {ticketModalBooking && (
            <div className="modal fade show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(8px)', zIndex: 1060 }}>
              <div className="modal-dialog modal-dialog-centered">
                <div className="modal-content cinema-modal border-0 p-4">
                  <div className="d-flex justify-content-between align-items-center mb-3">
                    <h5 className="modal-title fw-bold text-white mb-0">Official E-Ticket</h5>
                    <button type="button" className="btn-close btn-close-white" onClick={() => setTicketModalBooking(null)}></button>
                  </div>
                  <div className="ticket-wrapper text-center mb-3">
                    <h4 className="text-white fw-bold mb-1">{ticketModalBooking.movieTitle}</h4>
                    <span className="text-secondary small d-block mb-2">{ticketModalBooking.theatreName} ({ticketModalBooking.screenName})</span>
                    <span className="badge badge-gold fs-5 mb-2">Seats: {ticketModalBooking.seats.join(', ')}</span>
                    <div className="text-secondary small">{ticketModalBooking.showDate} • {ticketModalBooking.showTime}</div>
                    <div className="mt-3 p-2 bg-white d-inline-block rounded">
                      <i className="bi bi-qr-code text-dark" style={{ fontSize: '80px' }}></i>
                    </div>
                    <span className="d-block text-secondary font-monospace small mt-1">{ticketModalBooking.bookingNumber}</span>
                  </div>
                  <button className="btn glow-btn w-100" onClick={() => window.print()}>Print / Download Ticket</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto py-4 border-top border-secondary border-opacity-25 bg-dark">
            <div className="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 text-secondary small">
              <span>© 2026 IMovies Entertainment Inc. Movie ticket booking made simple.</span>
              <span>MERN Stack Cinema Platform • Ready for Evaluation</span>
            </div>
          </footer>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
